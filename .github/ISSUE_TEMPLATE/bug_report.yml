name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **do not** include patient data, credentials, or tokens.
        Security issues must be reported privately — see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit / image tag
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - local development
        - staging
        - production
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove any sensitive information first.
      render: shell
